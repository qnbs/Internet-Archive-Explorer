<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PWA icon source</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #111827;
      }
      #pwa-icon-root {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 30% 20%, #0e7490 0%, #111827 55%, #030712 100%);
      }
      .mark {
        width: 72%;
        height: 72%;
        max-width: 420px;
        max-height: 420px;
        border-radius: 22%;
        background: linear-gradient(145deg, #0891b2 0%, #0e7490 45%, #155e75 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 24px 48px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }
      .mark svg {
        width: 58%;
        height: 58%;
        color: #f9fafb;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
      }
    </style>
  </head>
  <body>
    <div id="pwa-icon-root">
      <div class="mark" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 21h18M5 18V9.261a1 1 0 01.553-.894l7-3.5a1 1 0 01.894 0l7 3.5A1 1 0 0120 9.261V18M7 21V9m5 12V9m5 12V9"
          />
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 7l9-4 9 4" />
        </svg>
      </div>
    </div>
  </body>
</html>
