name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate

  static-analysis:
    name: Lint, i18n, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:ci
      - run: pnpm run check:i18n
      - run: pnpm exec tsc --noEmit

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build-bundle:
    name: Build and bundle budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (with bundle analysis)
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          ANALYZE: 'true'
        run: pnpm run build
      - name: Verify expected build artifacts
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/.nojekyll
          test -f dist/locales/en/common.json
          test -f dist/locales/de/common.json
          test -f dist/manifest.json
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          grep -q 'icons/icon-192.png' dist/manifest.json
          grep -q 'screenshots/' dist/manifest.json
      - name: Verify PWA marketing screenshots (not placeholders)
        run: |
          node scripts/check-pwa-screenshots.mjs
          PWA_SCREENSHOTS_DIR=dist/screenshots node scripts/check-pwa-screenshots.mjs
      - name: Verify GitHub Pages base paths in HTML
        run: |
          set -euo pipefail
          BASE_PATH="/${{ github.event.repository.name }}/"
          grep -q "${BASE_PATH}assets/" dist/index.html
          grep -q 'sw-register.js' dist/index.html
      - run: pnpm run check:bundle-size
      - uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis
          path: dist/bundle-report.json
          retention-days: 14
          if-no-files-found: ignore

  e2e-a11y:
    name: E2E and accessibility
    needs: build-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist/
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests (Chromium)
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm exec playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  cross-browser-smoke:
    name: Cross-browser smoke
    needs: build-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist/
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run @smoke across browsers
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm exec playwright test --grep @smoke --project=firefox-smoke --project=webkit-smoke --project=mobile-chrome-smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cross-browser-smoke-results
          path: test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    needs: build-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist/
      - run: pnpm exec playwright install --with-deps chromium
      - name: Lighthouse CI (desktop / a11y gates)
        run: |
          REPO="${{ github.event.repository.name }}"
          sed "s/Internet-Archive-Explorer/${REPO}/g" lighthouserc.json > lighthouserc.run.json
          npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.run.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore

  ci-gate:
    name: CI Gate
    needs:
      - security
      - static-analysis
      - unit
      - build-bundle
      - e2e-a11y
      - cross-browser-smoke
      - lighthouse
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all quality jobs
        run: |
          set -euo pipefail
          check() {
            local name="$1"
            local result="$2"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              exit 1
            fi
          }
          check security "${{ needs.security.result }}"
          check static-analysis "${{ needs.static-analysis.result }}"
          check unit "${{ needs.unit.result }}"
          check build-bundle "${{ needs.build-bundle.result }}"
          check e2e-a11y "${{ needs.e2e-a11y.result }}"
          check cross-browser-smoke "${{ needs.cross-browser-smoke.result }}"
          check lighthouse "${{ needs.lighthouse.result }}"
